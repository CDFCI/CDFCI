name: CDFCI Test

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install GCC 11
        run: |
          sudo apt update
          sudo apt install -y g++-11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
      - name: Build and Test
        run: |
          g++ --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target examples --parallel 2

  regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install GCC 11
        run: |
          sudo apt update
          sudo apt install -y g++-11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
      - name: Build and Test
        run: |
          g++ --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  macos-arm64-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Install OpenMP runtime
        run: brew install libomp
      - name: Build and Test with Apple Clang
        run: |
          clang++ --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOpenMP_ROOT="$(brew --prefix libomp)"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install GCC 11
        run: |
          sudo apt update
          sudo apt install -y g++-11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
      - name: Build release binaries
        run: |
          g++ --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --parallel 2
          cmake --install build --prefix release
      - name: Package release artifacts
        run: |
          cp README.md CHANGELOG.md LICENSE release/
          tar -czf cdfci-${GITHUB_REF_NAME}-linux-x64.tar.gz -C release .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdfci-${{ github.ref_name }}-linux-x64
          path: cdfci-${{ github.ref_name }}-linux-x64.tar.gz
